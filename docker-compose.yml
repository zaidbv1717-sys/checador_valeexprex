services:
  postgres:
    image: postgres:16-alpine
    container_name: reloj_checador_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reloj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reloj}
      POSTGRES_DB: ${POSTGRES_DB:-reloj_checador}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reloj}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
