services:
  postgres:
    image: postgres:16-alpine
    container_name: reloj_checador_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reloj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reloj}
      POSTGRES_DB: ${POSTGRES_DB:-reloj_checador}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reloj} -d ${POSTGRES_DB:-reloj_checador}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: reloj_checador_backend
    restart: unless-stopped
    environment:
      # La oficina esta en Mazatlan (MST, -0700). Sin esto el contenedor corre en
      # UTC y las jornadas que terminan despues de las 17:00 cruzan de dia, lo que
      # las contabiliza como cero horas trabajadas. Ver backend/app/clock.py.
      TZ: ${TZ:-America/Mazatlan}
      OFFICE_TZ: ${OFFICE_TZ:-America/Mazatlan}
      DATABASE_URL: postgresql://${POSTGRES_USER:-reloj}:${POSTGRES_PASSWORD:-reloj}@postgres:5432/${POSTGRES_DB:-reloj_checador}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-1234}
      MAX_BACKUPS: ${MAX_BACKUPS:-30}
      DEVICE_ALERT_WINDOW_MIN: ${DEVICE_ALERT_WINDOW_MIN:-5}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      BACKUP_DIR: /app/data/backups
      PHOTOS_DIR: /app/data/photos
      PUNCH_PHOTOS_DIR: /app/data/punch_photos
    volumes:
      - ./data/backups:/app/data/backups
      - ./data/photos:/app/data/photos
      - ./data/punch_photos:/app/data/punch_photos
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    container_name: reloj_checador_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
