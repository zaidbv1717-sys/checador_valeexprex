# ============================================================
# Reloj Checador — bloque de Nginx del VPS de STAGING (45.82.73.42)
# Destino: /etc/nginx/sites-available/checador-staging
# ============================================================
# Por que hace falta este archivo y no basta el nginx del contenedor:
# el puerto 80 y el 443 del host ya son del nginx del sistema, que termina el
# TLS de *.staging.valeexpress.mx. El contenedor del checador publica en
# 127.0.0.1:8085 y este bloque es su puerta publica.
#
# Igual que valeexpress-staging: define SOLO el bloque :80. certbot --nginx
# agrega el :443 y el redirect al emitir el certificado. Escribirlo al reves
# (un :443 apuntando a certificados que aun no existen) rompe `nginx -t` y deja
# el servidor sin nginx, justo lo que impide emitirlos.
#
# ANTES DE ACTIVAR: el DNS de checador.staging.valeexpress.mx NO existe todavia
# (comprobado con getent: sin respuesta, mientras api.staging.valeexpress.mx si
# resuelve a 45.82.73.42). Hay que crear el registro A en Cloudflare apuntando a
# 45.82.73.42 y en modo "DNS only", no proxied: el Universal SSL gratuito no
# cubre un tercer nivel como *.staging, asi que el TLS lo pone certbot aqui.
#
# Activar:
#   ln -sf /etc/nginx/sites-available/checador-staging /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d checador.staging.valeexpress.mx
# ============================================================

server {
    server_name checador.staging.valeexpress.mx;

    # Una foto de celular ronda 2-5 MB y el backend rechaza arriba de 8 MB
    # (MAX_PHOTO_BYTES). Se corta aqui antes para no gastar disco ni RAM del
    # backend, que comparte 3.8 GB con todo ValeExpress.
    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # La API. Va antes que `location /` porque nginx elige el prefijo mas largo,
    # pero se escribe explicito para que se lea el reparto de un vistazo.
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # El backend lee este header para saber que dispositivo marco
        # (backend/app/net.py). Sin el, todos los empleados comparten la IP del
        # proxy y la deteccion de dispositivo compartido acusa a gente honesta.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # El frontend (nginx del contenedor sirviendo el build de React).
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
