server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Una foto de celular ronda 2-5 MB. El backend rechaza arriba de 8 MB
    # (MAX_PHOTO_BYTES); aqui se corta antes para no gastar disco ni RAM del
    # backend con subidas grandes.
    client_max_body_size 10m;

    # El checador vive en LAN sobre HTTP plano, asi que no se pone HSTS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # El backend lee este header para saber que dispositivo marco (ver
        # backend/app/net.py). Sin el, todos los empleados comparten la IP de
        # nginx y la deteccion de dispositivo compartido acusa a gente honesta.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
